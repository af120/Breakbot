name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Barbershop
        env:
          VITE_API_URL: https://barbershop-api.af120-barbershop.workers.dev/api
        run: |
          cd barbershop
          npm install
          npm run build

      - name: Prepare Combined Artifact
        run: |
          mkdir -p public_html
          cp -r restaurant public_html/restaurant
          cp -r barbershop/dist public_html/barbershop

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public_html"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
