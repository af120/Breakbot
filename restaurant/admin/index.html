<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Ember & Oak</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="loginScreen" class="auth-container">
    <div class="auth-card">
      <h2>Ember & Oak Admin</h2>
      <p>Please log in to continue</p>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn">Log In</button>
        <p id="loginError" class="error-msg"></p>
      </form>
    </div>
  </div>

  <!-- Dashboard Screen -->
  <div id="dashboardScreen" class="dashboard-container" style="display: none;">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h3>E&O Admin</h3>
      </div>
      <nav class="sidebar-nav">
        <a href="#reservations" class="active">Reservations</a>
        <a href="#menu">Menu</a>
        <a href="#settings">Settings</a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn btn-outline">Log Out</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h2 id="pageTitle">Reservations</h2>
      </header>
      
      <div class="content-area">
        <!-- Reservations View -->
        <div id="view-reservations" class="view active">
          <div class="stats-grid">
            <div class="stat-card">
              <h4>Today's Guests</h4>
              <div class="stat-value" id="statTodayGuests">-</div>
            </div>
            <div class="stat-card">
              <h4>Pending</h4>
              <div class="stat-value" id="statPending">-</div>
            </div>
          </div>
          
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Guest</th>
                  <th>Date & Time</th>
                  <th>Party</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="reservationsTableBody">
                <tr><td colspan="6">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
        
        <!-- Menu View (Placeholder) -->
        <div id="view-menu" class="view" style="display: none;">
          <p>Menu management coming soon.</p>
        </div>

        <!-- Settings View (Placeholder) -->
        <div id="view-settings" class="view" style="display: none;">
          <p>Settings management coming soon.</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
